name: Generate icon index

on:
  push:
    paths:
      - "icon/**"
      - ".github/generate_json.py"
      - ".github/workflows/generate_json.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-icon-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate and validate icon index
        run: |
          python .github/generate_json.py
          python -m json.tool staryun_icons.json > /dev/null

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staryun_icons.json

          if git diff --cached --quiet; then
            echo "Icon index is already up to date."
            exit 0
          fi

          git commit -m "chore(icons): update generated index"
          git push
